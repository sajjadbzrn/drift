<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Parallel connections multiply download speed: browser 1x 16%, classic 4x 48%, drift 8x 100%.">
  <defs>
    <!-- flowing gradients (seamless loop via repeat + translate) -->
    <linearGradient id="flowA" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#0ea5e9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;0.5 0;0 0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flowB" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;0.5 0;0 0" dur="2.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flowC" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#a855f7"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;0.5 0;0 0" dur="1.8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="comet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow3" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="c1"><rect x="320" y="78" width="560" height="26" rx="13"/></clipPath>
    <clipPath id="c2"><rect x="320" y="183" width="560" height="26" rx="13"/></clipPath>
    <clipPath id="c3"><rect x="320" y="288" width="560" height="26" rx="13"/></clipPath>

    <style>
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:.85 } }
      .seg { animation: pulse 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="380" rx="22" fill="#0f172a"/>
  <text x="40" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Parallel connections → throughput</text>

  <!-- labels -->
  <text x="40" y="98"  font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">Browser · 1×</text>
  <text x="40" y="203" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">Classic · 4×</text>
  <text x="40" y="308" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">drift · 8×</text>

  <!-- tracks -->
  <rect x="320" y="78"  width="560" height="26" rx="13" fill="#1e293b"/>
  <rect x="320" y="183" width="560" height="26" rx="13" fill="#1e293b"/>
  <rect x="320" y="288" width="560" height="26" rx="13" fill="#1e293b"/>

  <!-- ===== Browser (1 segment) ===== -->
  <g clip-path="url(#c1)">
    <rect x="320" y="78" height="26" rx="13" fill="url(#flowA)">
      <animate attributeName="width" values="0;90;90;0;0" keyTimes="0;0.45;0.8;0.9;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="320" cy="91" r="9" fill="url(#comet)">
      <animate attributeName="cx" values="320;880" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;0.9" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== Classic (4 segments) ===== -->
  <g clip-path="url(#c2)">
    <rect x="320" y="183" height="26" rx="13" fill="url(#flowB)">
      <animate attributeName="width" values="0;269;269;0;0" keyTimes="0;0.5;0.8;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- 3 dividers → 4 segments -->
    <g stroke="#0f172a" stroke-width="3">
      <line x1="460" y1="183" x2="460" y2="209" class="seg"/>
      <line x1="600" y1="183" x2="600" y2="209" class="seg" style="animation-delay:.4s"/>
      <line x1="740" y1="183" x2="740" y2="209" class="seg" style="animation-delay:.8s"/>
    </g>
    <circle cx="320" cy="196" r="9" fill="url(#comet)">
      <animate attributeName="cx" values="320;880" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;0.9" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== drift (8 segments, glow) ===== -->
  <g clip-path="url(#c3)">
    <rect x="320" y="288" height="26" rx="13" fill="url(#flowC)" filter="url(#glow3)">
      <animate attributeName="width" values="0;560;560;0;0" keyTimes="0;0.55;0.8;0.9;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- 7 dividers → 8 segments -->
    <g stroke="#0f172a" stroke-width="3">
      <line x1="390"  y1="288" x2="390"  y2="314" class="seg"/>
      <line x1="460"  y1="288" x2="460"  y2="314" class="seg" style="animation-delay:.2s"/>
      <line x1="530"  y1="288" x2="530"  y2="314" class="seg" style="animation-delay:.4s"/>
      <line x1="600"  y1="288" x2="600"  y2="314" class="seg" style="animation-delay:.6s"/>
      <line x1="670"  y1="288" x2="670"  y2="314" class="seg" style="animation-delay:.8s"/>
      <line x1="740"  y1="288" x2="740"  y2="314" class="seg" style="animation-delay:1.0s"/>
      <line x1="810"  y1="288" x2="810"  y2="314" class="seg" style="animation-delay:1.2s"/>
    </g>
    <circle cx="320" cy="301" r="10" fill="url(#comet)">
      <animate attributeName="cx" values="320;880" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.8;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- percentage readouts -->
  <text x="900" y="100" text-anchor="end" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#7dd3fc">16%</text>
  <text x="900" y="205" text-anchor="end" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#c4b5fd">48%</text>
  <text x="900" y="310" text-anchor="end" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#e9d5ff">100%</text>
</svg>
