name: Release

# Build signed installers/artifacts whenever a v* tag is pushed:
#
#   bun scripts/bump-version.mjs 0.3.1
#   git add -A && git commit -m "Release v0.3.1"
#   git tag v0.3.1 && git push && git push --tags
#
# The workflow uploads:
#   - Windows: drift_<version>_x64-setup.exe, its .sig and latest.json
#   - Android: drift_<version>_arm64...-android.apk (signed, sideloadable)
#   - the browser extension zip
# to the GitHub release. Users update in place from Settings -> Updates.
#
# First-time setup:
#   1. Create a GitHub repo and push this project.
#   2. Add the Windows signing private key as a repo secret TAURI_SIGNING_PRIVATE_KEY
#      (it lives locally in .keys/drift.key).
#   3. Add the Android release keystore secrets so the APK is signed and installable:
#        ANDROID_KEYSTORE_BASE64  – base64 of src-tauri/gen/android/drift-release.keystore
#        ANDROID_KEY_ALIAS        – e.g. drift
#        ANDROID_KEY_PASSWORD     – key password
#        ANDROID_STORE_PASSWORD   – keystore password
#   4. In src-tauri/tauri.conf.json, replace OWNER/REPO in the updater
#      endpoint with your actual GitHub owner/repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build native messaging host
        run: bun scripts/build-host.mjs

      - name: Build release bundles
        run: bun run tauri build --bundles nsis

      - name: Generate updater manifest
        run: >
          bun scripts/make-update-json.mjs
          --version ${{ github.ref_name }}
          --owner ${{ github.repository_owner }}
          --repo ${{ github.event.repository.name }}

      - name: Package browser extension
        run: powershell Compress-Archive -Path extension/* -DestinationPath drift-extension.zip -Force

      - name: Upload artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
            drift-extension.zip

  android:
    name: Android APK
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK / build-tools / platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.0.12077973" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Refresh app icons from source logo
        run: bun tauri icon src-tauri/icons/icon.png

      - name: Initialize Android project
        run: bun tauri android init --ci

      - name: Configure release signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/drift-release.keystore
            cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=../drift-release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK will be UNSIGNED and not installable."
          fi

      - name: Build Android APK
        run: bun tauri android build --apk --ci

      - name: Upload APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
