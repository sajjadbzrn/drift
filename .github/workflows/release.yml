name: Release

# Build signed installers/artifacts for Windows and Linux whenever a
# v* tag is pushed:
#
#   bun scripts/bump-version.mjs 0.3.3
#   git add -A && git commit -m "Release v0.3.3"
#   git tag v0.3.3 && git push && git push --tags
#
# The workflow:
#   - Windows (nsis)   builds on windows-latest
#   - Linux   (deb + AppImage) builds on ubuntu-latest
# and uploads every installer + its .sig, the browser extension zip, and a
# single combined latest.json (covering both platforms) to the GitHub
# release. Users update in place from Settings -> Updates.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build native messaging host
        run: bun scripts/build-host.mjs

      - name: Build release bundles
        run: bun run tauri build --bundles nsis

      - name: Package browser extension
        run: powershell Compress-Archive -Path extension/* -DestinationPath drift-extension.zip -Force

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/* dist/
          cp drift-extension.zip dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist
          if-no-files-found: error

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build release bundles
        run: bun run tauri build --bundles deb,appimage

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp -r src-tauri/target/release/bundle/deb/* dist/
          cp -r src-tauri/target/release/bundle/appimage/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist
          if-no-files-found: error

  release:
    needs: [build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Flatten artifacts into one folder
        run: |
          mkdir -p dist
          find staging -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.sig' -o -name 'latest.json' \) -exec cp -t dist/ {} +

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "No tag found. Skipping release creation."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate combined updater manifest
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          bun scripts/make-update-json.mjs \
            --version $VERSION \
            --owner ${{ github.repository_owner }} \
            --repo ${{ github.event.repository.name }} \
            --dir dist

      - name: Upload artifacts to the release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*
          body: |
            ## drift ${{ steps.version.outputs.tag }}

            A cross-platform release — **drift now ships installers for Windows and Linux**, with in-place auto-update.

            ### Highlights
            - **Windows + Linux** — grab the Windows NSIS installer or a Linux `.deb` / `.AppImage` from the assets below.
            - **Fresh logo** — the browser companion extension now uses the new drift logo.
            - **Living background** — the cosmic drift animation keeps moving even when the window loses focus; only the mouse parallax pauses, so it feels alive without eating the GPU.
            - **No more white flash** — the window now paints dark from the very first frame, so there's no blink of white before the UI loads.
            - **Smarter updates** — a single combined updater manifest keeps every platform current from *Settings → Updates*.

            ### Install
            - **Windows**: run `drift_*_x64-setup.exe`
            - **Linux**: `sudo dpkg -i drift_*_amd64.deb` (or use the AppImage)
